name: Build and push GHCR

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # En un PR se pasa lint, tests y la construcción de la imagen (sin publicar
  # ni desplegar): un Dockerfile roto se ve antes de fusionar, no en producción.
  # Sin filtro de rama base: los PR apilados sobre otra rama también se comprueban.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  # Nunca cancelar un deploy a medias (pull/up).
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: javipaez7/tanke

jobs:
  # Lint y tests antes de construir la imagen: hasta ahora el pipeline solo
  # compilaba, así que un test roto llegaba igual a producción.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tanke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tanke/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  build-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: vars
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # El proyecto vive anidado en tanke/.
          context: ./tanke
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via forced-command SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          SHORT_SHA: ${{ needs.build-push.outputs.short_sha }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_KEY}" || { echo "missing secret DEPLOY_SSH_KEY" >&2; exit 1; }
          test -n "${VPS_HOST}" || { echo "missing secret VPS_HOST" >&2; exit 1; }
          test -n "${VPS_HOST_KEY}" || { echo "missing secret VPS_HOST_KEY" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Fuerza el script remoto; el comando es "app sha" (determinista).
          # La app se llama gas-tracker porque vive en /opt/gas-tracker.
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "dockerdeploy@${VPS_HOST}" \
            "gas-tracker ${SHORT_SHA}"
