name: Build and push GHCR

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  # Nunca cancelar un deploy a medias (pull/up).
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: javipaez7/tanke

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: vars
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # El proyecto vive anidado en tanke/ (el repo tiene ademas vercel.json).
          context: ./tanke
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via forced-command SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          SHORT_SHA: ${{ needs.build-push.outputs.short_sha }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_SSH_KEY}" || { echo "missing secret DEPLOY_SSH_KEY" >&2; exit 1; }
          test -n "${VPS_HOST}" || { echo "missing secret VPS_HOST" >&2; exit 1; }
          test -n "${VPS_HOST_KEY}" || { echo "missing secret VPS_HOST_KEY" >&2; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Fuerza el script remoto; el comando es "app sha" (determinista).
          # La app se llama gas-tracker porque vive en /opt/gas-tracker.
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "dockerdeploy@${VPS_HOST}" \
            "gas-tracker ${SHORT_SHA}"
