services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tanke
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tanke}
      POSTGRES_DB: tanke
    volumes:
      - tanke_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanke -d tanke"]
      interval: 5s
      timeout: 3s
      retries: 20

  tanke:
    image: ghcr.io/javipaez7/tanke:${IMAGE_TAG:-latest}
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - '172.17.0.1:3002:3002'
    environment:
      DATABASE_URL: postgresql://tanke:${POSTGRES_PASSWORD:-tanke}@db:5432/tanke
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tanke.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-TankeAdmin2026}
      SNAPSHOT_PROVINCES: ${SNAPSHOT_PROVINCES:-35,38}
      # Correo transaccional (recuperar contrasena). Sin SMTP_URL la app
      # arranca igual: los emails se escriben en el log en vez de enviarse.
      APP_URL: ${APP_URL:-https://tanke.javistudio.dev}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-Tanke <no-reply@mail.javistudio.dev>}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - public-edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public-edge"
      - "traefik.http.routers.tanke.rule=Host(`tanke.javistudio.dev`)"
      - "traefik.http.routers.tanke.entrypoints=websecure"
      - "traefik.http.routers.tanke.tls.certresolver=le"
      - "traefik.http.services.tanke.loadbalancer.server.port=3002"

volumes:
  tanke_pg:

networks:
  public-edge:
    external: true
